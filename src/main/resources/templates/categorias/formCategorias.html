<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Nueva Categoría</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">	
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">
</head>
<body>
	<h1>Crear nueva categoria:</h1>
	
	<form th:action="@{/categorias/save}" method="post">
		<div class ="form-group">
			<label for="nombre">Categoria:</label><br>
			<input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ingrese la categoria"><br>
		</div>

		<div class="form-group">
			<label for="descripcion">Descripcion:</label><br>
			<input type="text" id="descripcion" name="descripcion" class="form-control" placeholder="Ingrese una breve descripción"><br><br>	 
		</div>

		<button type="submit" class="btn btn-primary">Guardar</button>
	</form>
	
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.min.js"></script>	
</body>
</html>
