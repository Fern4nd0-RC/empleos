<div th:replace="~{fragments/top :: top}"></div>

<main class="container py-5">
  <h4 class="display-5 fw-bold text-primary text-center py-2 my-4">Listado de vacantes</h4>

  <div class="card">
    <div class="card-body">
      <a class="btn btn-primary" th:href="@{/vacantes/create}" title="Crear nueva Oferta de Trabajo">
        <i class="fas fa-file"></i> Nueva
      </a>

      <hr />

      <div class="table-responsive">
        <table class="table table-hover table-bordered">
          <thead class="thead-light">
            <tr class="text-center">
              <th>Categoría</th>
              <th>Nombre</th>
              <th>Fecha Pub.</th>
              <th>Estatus</th>
              <th>Destacada</th>
              <th>Operaciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="tmpVacante : ${vacante}" class="text-center">
              <td> N/A </td>
              <td th:text="${tmpVacante.nombre}"></td>
              <td th:text="${tmpVacante.fecha}"></td>
              <td>
                <span th:class="${tmpVacante.estatus == 1} ? 'badge text-bg-primary' : 'badge text-bg-secondary'"
                  th:text="${tmpVacante.estatus == 1} ? 'Activa' : 'Cerrada'">
                </span>
              </td>
              <td>
                <span th:class="${tmpVacante.destacada == 1} ? 'badge text-bg-success' : 'badge text-bg-danger'"
                  th:text="${tmpVacante.destacada == 1} ? 'Sí' : 'No'">
                </span>
              </td>
              <td>
                <a href="#" class="btn btn-success btn-sm" role="button" title="Editar el registro.">
                  <i class="fas fa-pencil-alt" aria-hidden="true"></i>
                </a>

                <a href="#" class="btn btn-danger btn-sm confirmar" role="button" title="Eliminar el registro.">
                  <i class="fas fa-trash" aria-hidden="true"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <!-- /container -->
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

<script>
  // Guardamos en una variable una funcion que muestra un cuadro de dialogo de tipo confirm
  var dialogoConfirm = function (e) {
    if (!confirm('¿Realmente desea eliminar el registro?')) e.preventDefault();
  };

  // Aplicamos a todos los elementos HTML que tengan la clase CSS 'confirmar' el evento click para que muestre el cuadro de dialogo de confirmacion.
  document.querySelectorAll('.confirmar').forEach(function (elemento) {
    elemento.addEventListener('click', dialogoConfirm, false);
  });
</script>
</body>

</html>
